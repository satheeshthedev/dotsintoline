<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14110e">
  <title>Scan tickets · Dots into Line</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="scan">
  <main class="scan-main">
    <div class="scan-top">
      <a href="/admin/">← Dashboard</a>
      <span class="counter" id="counter">0 admitted</span>
    </div>

    <div id="reader"><div class="reader-idle" id="idle">Tap <b>&nbsp;Start camera&nbsp;</b> and point it at the ticket QR.</div></div>

    <div class="scan-controls">
      <button class="btn red" id="start">📷 Start camera</button>
      <button class="btn soft" id="flip" hidden>⟲ Switch camera</button>
    </div>

    <section class="result" id="result" aria-live="assertive"></section>

    <form class="manual" id="manual">
      <input id="code" placeholder="Type code: XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" maxlength="30">
      <button class="btn soft" type="submit">Check</button>
    </form>

    <label class="check"><input type="checkbox" id="auto"> Auto-admit valid tickets (fast entry mode)</label>
  </main>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/scan.js"></script>
</body>
</html>
